<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Login -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>Admin</h1>
      <p>Enter the admin password to manage your site.</p>
      <label>Password<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
      <button class="btn primary" type="submit" id="login-btn">Sign in</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="top">
      <div class="top-in">
        <strong class="top-title">Site admin</strong>
        <span class="dirty" id="dirty" hidden>Unsaved changes</span>
        <span class="spacer"></span>
        <a class="btn ghost sm" href="/" target="_blank" rel="noopener">View site ↗</a>
        <button class="btn primary sm" id="save">Save changes</button>
        <button class="btn ghost sm" id="logout">Sign out</button>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="site">Site &amp; logo</button>
        <button data-tab="theme">Theme</button>
        <button data-tab="contact">Contact &amp; map</button>
        <button data-tab="services">Services</button>
        <button data-tab="products">Products</button>
      </nav>
    </header>
    <main class="panel" id="panel"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
